name: 构建并发布镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建平台（多架构用逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"

# 同一分支/标签只保留一个进行中的构建，避免重复占用额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本号与镜像名
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          # 打 tag 触发时以 tag 为准，否则读取 VERSION 文件
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(tr -d ' \r\n\t' < VERSION)"
          fi
          # VERSION 只允许 x.y.z，避免生成非法镜像标签
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 格式不合法：${VERSION}（应为 主.次.修订，如 0.2.0）" >&2
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          # ghcr 要求镜像名全小写
          IMAGE="${GITHUB_REPOSITORY,,}"
          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR}.${MINOR}"
            echo "image=${IMAGE}"
          } >> "${GITHUB_OUTPUT}"
          echo "版本 ${VERSION} -> ${REGISTRY:-ghcr.io}/${IMAGE}"

      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.major_minor }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=meeko-console
            org.opencontainers.image.description=Meeko 面板 — SSL 证书 + DDNS + EasyTier 一体化控制台
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送镜像
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR 只构建不推送，分支/标签/workflow_dispatch 均推送
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 显式传入全部基础镜像参数：既避免 BuildKit 展开全局 ARG 的问题，
          # 也方便在仓库 Variables 里一键切到国内加速源（未设置时用官方源）
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            EASYTIER_IMAGE=${{ vars.EASYTIER_IMAGE || 'easytier/easytier:latest' }}
            CADDY_IMAGE=${{ vars.CADDY_IMAGE || 'caddy:2.8-alpine' }}
            NODE_IMAGE=${{ vars.NODE_IMAGE || 'node:20-alpine' }}
            ALPINE_IMAGE=${{ vars.ALPINE_IMAGE || 'alpine:3.23' }}
          cache-from: type=gha,scope=meeko-console
          cache-to: type=gha,mode=max,scope=meeko-console

      - name: 输出镜像地址
        run: |
          {
            echo "### meeko-console ${{ steps.vars.outputs.version }}"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # 打 v* 标签时，把已推送的多架构镜像按单架构导出成 tar.gz（离线镜像包），
  # 作为 Release 附件发布，受限网络里可以 docker load 直接用。
  export:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: amd64
          - suffix: arm64
    steps:
      - name: 安装 skopeo
        run: sudo apt-get install -y --no-install-recommends skopeo

      - name: 导出单架构镜像包
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REF="ghcr.io/${IMAGE}:${VERSION}"
          TAR="meeko-console-${VERSION}-linux-${SUFFIX}.tar"
          FILE="${TAR}.gz"
          # 直接从 registry 取指定平台的镜像，写成 docker load 可用的 docker-archive。
          # 不用 docker pull + docker save：多架构镜像在 containerd 镜像存储里只落单平台 manifest，
          # save 会报 "unable to create manifests file ... content digest not found"。
          # docker-archive 后面跟的 <仓库>:<标签> 会写进 manifest.json 的 RepoTags，加载后即为该标签。
          skopeo copy \
            --override-os linux --override-arch "${SUFFIX}" \
            --src-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            "docker://${REF}" "docker-archive:${TAR}:${REF}"
          gzip -6 "${TAR}"
          ls -lh "${FILE}"
          sha256sum "${FILE}" > "SHA256SUMS-${SUFFIX}.txt"
          cat "SHA256SUMS-${SUFFIX}.txt"

      - name: 上传镜像包（临时产物）
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.suffix }}
          path: |
            meeko-console-*.tar.gz
            SHA256SUMS-*.txt
          retention-days: 3

  # 构建成功后自动创建 GitHub Release（发行版）并挂上镜像文件，
  # 这样「发行版」页面既有最新版本，也能直接下载到镜像。
  release:
    needs: [build, export]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载镜像包
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: image-*
          merge-multiple: true

      - name: 汇总校验文件
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          cat SHA256SUMS-amd64.txt SHA256SUMS-arm64.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-amd64.txt SHA256SUMS-arm64.txt
          ls -lh

      - name: 组装发行说明
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAJOR_MINOR="${VERSION%.*}"
          {
            echo "## Meeko 面板 v${VERSION}"
            echo ""
            echo "SSL 证书 + DDNS + EasyTier 一体化控制台，单容器、host 网络模式。"
            echo ""
            echo "### 镜像（多架构：linux/amd64 / linux/arm64）"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${IMAGE}:${VERSION}"
            echo "docker pull ghcr.io/${IMAGE}:${MAJOR_MINOR}"
            echo '```'
            if [[ -n "${DIGEST}" ]]; then
              echo ""
              echo "镜像摘要：\`${DIGEST}\`"
            fi
            echo ""
            echo "### 离线镜像包（本页下方 Assets 可直接下载）"
            echo ""
            echo "| 文件 | 适用 |"
            echo "|------|------|"
            echo "| \`meeko-console-${VERSION}-linux-amd64.tar.gz\` | x86_64 服务器（最常见） |"
            echo "| \`meeko-console-${VERSION}-linux-arm64.tar.gz\` | ARM64 服务器（如甲骨文/群晖 ARM 机型） |"
            echo "| \`SHA256SUMS.txt\` | 下载后校验完整性 |"
            echo ""
            echo '```bash'
            echo "# 加载后镜像标签即 ghcr.io/${IMAGE}:${VERSION}"
            echo "docker load -i meeko-console-${VERSION}-linux-amd64.tar.gz"
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "### 部署"
            echo ""
            echo '```bash'
            echo "git clone https://github.com/${REPO}.git"
            echo "cd meeko-console"
            echo "cp .env.example .env   # 先改 CONSOLE_USER / CONSOLE_PASS"
            echo "bash deploy.sh up"
            echo '```'
            echo ""
            echo "### 完整变更"
            echo ""
            echo "见 [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md)。"
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新说明"
            gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${TAG}" \
              --title "Meeko 面板 ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --verify-tag
          fi

      - name: 上传镜像文件到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            assets/*.tar.gz \
            assets/SHA256SUMS.txt \
            --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets \
            | jq -r '.assets[] | "\(.name)  \(.size) bytes"'
